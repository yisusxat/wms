services:
  - type: web
    name: wms-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: INSFORGE_URL
        sync: false
      - key: INSFORGE_ANON_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Secreto fuerte generado por Render: evita el valor por defecto 'wms-secret' (hallazgo C5)
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
